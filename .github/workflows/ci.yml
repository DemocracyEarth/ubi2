name: ci

# The Definition-of-Done gates on every push / PR. Make this a REQUIRED status check in branch
# protection so a merge can't reach main red.
#
# Two silent breaks previously reached main via hand-merges — a compile error and a dropped tx-gossip
# cache. The compile error any `cargo build` catches; the gossip break is caught ONLY by the
# multi-process `m5_stage_a` test, which needs a freshly-built node binary (a plain `cargo test` does
# not rebuild the spawned `ubi2-node` binary). Hence the dedicated `multinode` job below.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  chain:
    name: chain (rust — fmt, clippy, build, test)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (pinned via rust-toolchain.toml)
        run: |
          rustup show
          rustc --version
      - uses: Swatinem/rust-cache@v2
      - name: Format + lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
      - name: Build
        run: cargo build --workspace --locked
      # Single-threaded: several integration tests bind fixed localhost ports and race under
      # parallelism (FU-22 — migrate them to ephemeral ports). Serial is reliable in CI.
      - name: Test (qa + reliability property tests)
        run: cargo test --workspace --locked -- --test-threads=1

  v2-crypto-benchmark:
    name: v2 identity (isolated circuit benchmark)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: tools/v2-crypto-bench
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (pinned via rust-toolchain.toml)
        run: |
          rustup show
          rustc --version
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/v2-crypto-bench -> target
      - name: Format
        run: cargo fmt -- --check
      - name: Lint
        run: cargo clippy --release --locked --all-targets -- -D warnings
      - name: Compile browser prover bridge
        run: cargo build --release --locked --target wasm32-unknown-unknown --lib --features browser
      - name: Relation tests and pinned constraint budgets
        run: cargo test --release --locked
      - name: Generate and verify every Groth16 candidate proof
        run: >-
          cargo test --release --locked
          all_candidates_generate_verified_groth16_proofs -- --ignored --nocapture
      - name: Emit deterministic constraint report
        run: |
          cargo run --release --locked -- --constraints-only
          cargo run --release --locked -- --registry-depths --constraints-only
          cargo run --release --locked -- --transport-estimates
          cargo run --release --locked -- --status-distribution

  multinode:
    name: chain (rust — multi-node acceptance, m5_stage_a)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (pinned via rust-toolchain.toml)
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      # The test spawns the `target/debug/ubi2-node` BINARY as separate processes; `cargo test --test …`
      # does NOT rebuild that binary, so build the whole workspace first or the test runs stale code.
      - name: Build node binary
        run: cargo build --workspace --locked
      - name: m5_stage_a (EC-1/2/3/4/7 — mesh, tx gossip, height + state-root agreement, late-join sync)
        run: cargo test --test m5_stage_a -p ubi2-node -- --ignored --nocapture

  interfaces:
    name: interfaces (node — build + typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # No `version:` here — pnpm/action-setup reads it from the `packageManager`
      # field in package.json (pnpm@10.2.1). Pinning it in both errors out.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - name: TypeScript SDK tests
        run: pnpm --filter @ubi2/sdk test

  contracts:
    name: contracts (solidity — forge fmt + test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          # Phase 1 QA and the committed gas baseline were produced with this release.
          version: v1.5.1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # lib/ is not vendored. Pin immutable commits, not moving branches/tags.
      - name: Restore pinned dependencies
        working-directory: contracts
        run: >-
          forge install
          OpenZeppelin/openzeppelin-contracts@cab19933c33c2ad1d4c7a84864a3601dddfd16f3
          foundry-rs/forge-std@bf647bd6046f2f7da30d0c2bf435e5c76a780c1b
          --no-git
      - name: Toolchain identity
        working-directory: contracts
        run: forge --version && node --version && pnpm --version
      - name: Format
        working-directory: contracts
        run: forge fmt --check
      - name: Optimized build and EIP-170 sizes
        working-directory: contracts
        run: forge build --sizes
      - name: Unit, fuzz, invariant, privacy, and integration tests
        working-directory: contracts
        run: forge test -vv
      - name: ProofOfHumanity and PredicateVerifier coverage gate
        working-directory: contracts
        run: |
          forge coverage --report lcov --report-file lcov.info
          node scripts/check-coverage.mjs lcov.info 95
      - name: Deterministic target-call gas regression
        working-directory: contracts
        run: forge snapshot --check --match-contract GasBenchmarksTest
      - name: Solidity and TypeScript EIP-712 cross-stack parity
        run: pnpm --filter @ubi2/proofofhumanity test:contracts
      - name: Phase 2 tooling rehearsal on Anvil
        working-directory: contracts
        run: ./scripts/test-phase2-local.sh
