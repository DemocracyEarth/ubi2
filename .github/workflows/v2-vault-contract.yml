name: v2-vault-contract

on:
  push:
    branches: [main]
    paths:
      - "docs/specs/adr/0014-v2-production-vault-and-private-status-refresh.md"
      - "docs/specs/v2-holder-browser-hardening.md"
      - "docs/reports/*v2-holder-browser-hardening.md"
      - "fixtures/v2-identity/production-vault-status-v1.json"
      - "fixtures/v2-identity/interface-v1.json"
      - "fixtures/v2-production-crypto/artifact-index-v1.json"
      - "fixtures/v2-production-crypto/holder-refresh-engine*"
      - "fixtures/v2-production-crypto/holder-browser-hardening-evidence-v1.json"
      - "fixtures/v2-production-crypto/parameters-v1.json"
      - "fixtures/v2-production-crypto/public-signals-v1.json"
      - "fixtures/v2-production-crypto/reference-vector-v1.json"
      - "packages/sdk/src/**"
      - "packages/sdk/browser/**"
      - "tools/v2-crypto-bench/browser/holder-private-status-refresh-worker.ts"
      - "tools/v2-crypto-bench/src/lib.rs"
      - "tools/v2-holder-refresh-engine/**"
      - "apps/holder-browser-harness/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/v2-vault-contract.yml"
  pull_request:
    paths:
      - "docs/specs/adr/0014-v2-production-vault-and-private-status-refresh.md"
      - "docs/specs/v2-holder-browser-hardening.md"
      - "docs/reports/*v2-holder-browser-hardening.md"
      - "fixtures/v2-identity/production-vault-status-v1.json"
      - "fixtures/v2-identity/interface-v1.json"
      - "fixtures/v2-production-crypto/artifact-index-v1.json"
      - "fixtures/v2-production-crypto/holder-refresh-engine*"
      - "fixtures/v2-production-crypto/holder-browser-hardening-evidence-v1.json"
      - "fixtures/v2-production-crypto/parameters-v1.json"
      - "fixtures/v2-production-crypto/public-signals-v1.json"
      - "fixtures/v2-production-crypto/reference-vector-v1.json"
      - "packages/sdk/src/**"
      - "packages/sdk/browser/**"
      - "tools/v2-crypto-bench/browser/holder-private-status-refresh-worker.ts"
      - "tools/v2-crypto-bench/src/lib.rs"
      - "tools/v2-holder-refresh-engine/**"
      - "apps/holder-browser-harness/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/v2-vault-contract.yml"
  workflow_dispatch:

jobs:
  contract:
    name: private payload + refresh contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:v2-vault-contract
      - run: pnpm test:v2-holder-refresh
      - run: pnpm test:v2-holder-refresh-wasm
      - run: pnpm --filter @ubi2/sdk typecheck
      - name: Typecheck content-addressed Worker entry
        run: >-
          pnpm exec tsc --noEmit --target ES2022 --module ESNext
          --moduleResolution Bundler --lib ES2022,DOM --strict --skipLibCheck
          tools/v2-crypto-bench/browser/holder-private-status-refresh-worker.ts

  browser-hardening:
    name: Chromium PWA + IndexedDB recovery
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @ubi2/holder-browser-harness exec playwright install --with-deps chromium
      - run: pnpm test:v2-holder-browser
      - name: Upload sanitized browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: holder-browser-hardening-evidence
          path: apps/holder-browser-harness/test-results/holder-browser-hardening-evidence.json
          if-no-files-found: warn
