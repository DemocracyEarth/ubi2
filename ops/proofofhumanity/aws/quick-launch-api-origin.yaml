AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Transaction-free PoH Quick Launch v1 API origin on Base Sepolia. One ECS/Fargate task is exposed
  through HTTPS; stop-before-start deployments deliberately trade availability for process-local
  state correctness. This template never creates, reads, or outputs a secret value.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC for the public HTTPS load balancer and Fargate task.
  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two public subnets in distinct Availability Zones.
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Existing public Route 53 zone that owns ApiHostname.
  ApiHostname:
    Type: String
    Default: quick-launch-api.proofofhumanity.org
    AllowedPattern: '^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?(?:\.[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?)+$'
    Description: Dedicated origin hostname; the browser continues to use proofofhumanity.org/api/*.
  CertificateArn:
    Type: String
    AllowedPattern: '^arn:aws:acm:[a-z0-9-]+:[0-9]{12}:certificate/[0-9a-f-]+$'
    Description: Existing ACM certificate that covers ApiHostname.
  ContainerImageUri:
    Type: String
    AllowedPattern: '^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com/[a-z0-9._/-]+@sha256:[0-9a-f]{64}$'
    Description: Immutable same-account ECR image URI by digest; tags are rejected.
  SourceRevision:
    Type: String
    AllowedPattern: '^[0-9a-f]{40}$'
    Description: Exact reviewed ubi2 commit embedded in the public health/readiness records.
  BaseSepoliaRpcUrl:
    Type: String
    Default: https://sepolia.base.org
    AllowedPattern: '^https://[^/?#@]+(?::[0-9]+)?(?:/[^?#@]*)?$'
    Description: Credential-free HTTPS Base Sepolia RPC URL; provider tokens are not accepted here.
  TopologyAttestationSha256:
    Type: String
    AllowedPattern: '^[0-9a-f]{64}$'
  IssuerSecretAttestationSha256:
    Type: String
    AllowedPattern: '^[0-9a-f]{64}$'
  SponsorSecretAttestationSha256:
    Type: String
    AllowedPattern: '^[0-9a-f]{64}$'
  IssuerPrivateKeySecretArn:
    Type: String
    NoEcho: true
    AllowedPattern: '^arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    Description: Approved Secrets Manager ARN containing only the issuer private-key value.
  SponsorPrivateKeySecretArn:
    Type: String
    NoEcho: true
    AllowedPattern: '^arn:aws:secretsmanager:[a-z0-9-]+:[0-9]{12}:secret:.+$'
    Description: Distinct approved Secrets Manager ARN containing only the sponsor private-key value.
  TaskExecutionRoleArn:
    Type: String
    AllowedPattern: '^arn:aws:iam::[0-9]{12}:role/(?:[A-Za-z0-9+=,.@_-]+/)*PoHQuickLaunchTaskExecutionRole$'
    ConstraintDescription: >-
      Must be the regionless ARN of the pre-created PoHQuickLaunchTaskExecutionRole. Run the
      transaction-free execution-role preflight to prove the account and us-east-1 resource binding.
    Description: >-
      Existing same-account ECS task execution role. This stack cannot create, update or attach IAM
      policies to it; its exact least-privilege contract is defined in the deployment runbook.
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90]

Resources:
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: poh-quick-launch-api
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      Tags:
        - Key: release
          Value: poh-quick-launch-v1
        - Key: network
          Value: base-sepolia

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ubi2/poh-quick-launch-api
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: release
          Value: poh-quick-launch-v1

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTPS ingress for the Quick Launch API load balancer
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: release
          Value: poh-quick-launch-v1

  TaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Only the Quick Launch load balancer can reach the Node task
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: release
          Value: poh-quick-launch-v1

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: poh-quick-launch-api
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Subnets: !Ref PublicSubnetIds
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
        - Key: routing.http.desync_mitigation_mode
          Value: strictest
        - Key: routing.http.xff_header_processing.mode
          Value: append
      Tags:
        - Key: release
          Value: poh-quick-launch-v1

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: poh-quick-launch-api
      VpcId: !Ref VpcId
      Port: 3000
      Protocol: HTTP
      ProtocolVersion: HTTP1
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPath: /api/healthz
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "5"
      Tags:
        - Key: release
          Value: poh-quick-launch-v1

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  ApiDnsRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref ApiHostname
      Type: A
      AliasTarget:
        DNSName: !GetAtt LoadBalancer.DNSName
        HostedZoneId: !GetAtt LoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: true

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: poh-quick-launch-api
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "1024"
      Memory: "2048"
      ExecutionRoleArn: !Ref TaskExecutionRoleArn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: quick-launch-api
          Image: !Ref ContainerImageUri
          Essential: true
          StopTimeout: 30
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
              AppProtocol: http
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: HOSTNAME
              Value: 0.0.0.0
            - Name: PORT
              Value: "3000"
            - Name: POH_API_RUNTIME
              Value: dedicated-single-replica
            - Name: POH_BLOCKCHAIN_TRANSACTIONS_ENABLED
              Value: "false"
            - Name: POH_SOURCE_REVISION
              Value: !Ref SourceRevision
            - Name: NEXT_PUBLIC_SELF_ENDPOINT
              Value: https://proofofhumanity.org/api/self-verify
            - Name: NEXT_PUBLIC_SELF_ENV
              Value: staging
            - Name: POH_RUNTIME_TOPOLOGY
              Value: single-sticky-node
            - Name: POH_BASE_SEPOLIA_RPC_URL
              Value: !Ref BaseSepoliaRpcUrl
            - Name: POH_TOPOLOGY_ATTESTATION_SHA256
              Value: !Ref TopologyAttestationSha256
            - Name: POH_ISSUER_SECRET_ATTESTATION_SHA256
              Value: !Ref IssuerSecretAttestationSha256
            - Name: POH_SPONSOR_SECRET_ATTESTATION_SHA256
              Value: !Ref SponsorSecretAttestationSha256
            - Name: POH_SPONSOR_TESTNET_CHAIN_IDS
              Value: "84532"
            - Name: POH_SPONSOR_MAX_GAS
              Value: "350000"
            - Name: POH_SPONSOR_MAX_FEE_WEI
              Value: "500000000000000"
            - Name: POH_SPONSOR_MIN_RESERVE_WEI
              Value: "1000000000000000"
            - Name: POH_SPONSOR_CONFIRMATIONS
              Value: "1"
            - Name: POH_SPONSOR_RECEIPT_TIMEOUT_MS
              Value: "90000"
            - Name: POH_SPONSOR_DAILY_TX_LIMIT
              Value: "10"
          Secrets:
            - Name: ISSUER_PRIVATE_KEY
              ValueFrom: !Ref IssuerPrivateKeySecretArn
            - Name: POH_SPONSOR_PRIVATE_KEY
              ValueFrom: !Ref SponsorPrivateKeySecretArn
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ApiLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api
              mode: non-blocking
              max-buffer-size: 4m
      Tags:
        - Key: release
          Value: poh-quick-launch-v1
        - Key: network
          Value: base-sepolia

  ApiService:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      ServiceName: poh-quick-launch-api
      Cluster: !Ref Cluster
      TaskDefinition: !Ref TaskDefinition
      LaunchType: FARGATE
      PlatformVersion: LATEST
      SchedulingStrategy: REPLICA
      DesiredCount: 1
      DeploymentController:
        Type: ECS
      DeploymentConfiguration:
        MaximumPercent: 100
        MinimumHealthyPercent: 0
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
      HealthCheckGracePeriodSeconds: 120
      EnableECSManagedTags: true
      EnableExecuteCommand: false
      PropagateTags: SERVICE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref TaskSecurityGroup
          Subnets: !Ref PublicSubnetIds
      LoadBalancers:
        - ContainerName: quick-launch-api
          ContainerPort: 3000
          TargetGroupArn: !Ref TargetGroup
      Tags:
        - Key: release
          Value: poh-quick-launch-v1
        - Key: network
          Value: base-sepolia

Outputs:
  ApiOrigin:
    Description: Safe public value to set as POH_QUICK_LAUNCH_API_ORIGIN on the Amplify main branch.
    Value: !Sub https://${ApiHostname}
  ApiHealthUrl:
    Value: !Sub https://${ApiHostname}/api/healthz
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  EcsServiceArn:
    Value: !Ref ApiService
