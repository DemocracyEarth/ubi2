[package]
name = "ubi2-rpc"
description = "ubi2 EVM-compatible JSON-RPC surface (jsonrpsee HTTP + WS)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
ubi2-runtime = { path = "../runtime" }
# The shared block re-execution kernel (spec 07 §2.3 / ADR-0006 Decision 3): the SINGLE ordered-op apply
# path. `execute_block` decodes raw txs via `ubi2_exec::decode_tx` and applies each via
# `ubi2_exec::apply_tx`, so the server follower and the browser follower (`crates/runtime-wasm`) run
# byte-identical state transitions — there is no logic fork (the AC-WB parity gate proves it).
ubi2-exec = { path = "../exec" }
tokio.workspace = true
jsonrpsee.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tracing.workspace = true
alloy-primitives.workspace = true
alloy-consensus.workspace = true
alloy-eips.workspace = true
alloy-rlp.workspace = true
alloy-sol-types.workspace = true
base64.workspace = true
derive_more.workspace = true
tower.workspace = true
tower-http.workspace = true
# Manual jsonrpsee accept loop (`serve`): captures each connection's peer SocketAddr and injects it into
# the per-request extensions so the localhost-only admin RPC can enforce its loopback gate. `hyper`
# names the incoming-body request type; both crates are already in the tree via jsonrpsee 0.24.
hyper.workspace = true
# M5 (Stage A): the proposer signs each block header with its secp256k1 key and a follower recovers the
# author (`ecrecover(proposer_sig) == proposer`, spec §2.2). `k256` is the secp256k1 ECDSA impl alloy
# already uses (alloy-primitives `k256` feature pulls it transitively), so naming it directly adds no
# new transitive weight. Used only for header signing/recovery — never reachable from the runtime.
k256 = { version = "0.13", features = ["ecdsa"] }
# M5 (SEC-M5A-3): the mempool size caps (`MEMPOOL_MAX_TXS` / `MEMPOOL_MAX_PER_SENDER`, spec §10/§3.3)
# live in `ubi2-network::consts` as the single canonical source; `ingest_raw_tx` enforces both. The
# network crate does NOT depend on rpc, so this edge stays acyclic; only `consts` (plain values) is used.
ubi2-network = { path = "../network" }

# WebSocket sync gateway (spec 07 §3.1): serves SyncRequest/SyncResponse over a ws:// endpoint so
# browser light clients can sync blocks without libp2p. tokio-tungstenite is the async WS library;
# futures-util provides the SinkExt/StreamExt combinators for the split sink/stream session loop.
tokio-tungstenite = "0.24"
futures-util = "0.3"

[dev-dependencies]
# Security PoC (C5-SEC-3): drive a STUBBED live-style backend (a blocking reqwest client, no network)
# through `produce_block` to prove the block-production task never panics dropping a blocking runtime.
ubi2-oracle = { path = "../oracle" }
reqwest = { workspace = true }
