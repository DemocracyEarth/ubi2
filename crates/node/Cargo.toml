[package]
name = "ubi2-node"
description = "ubi2 node binary: networking, block production, devnet wiring."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "ubi2_node"
path = "src/lib.rs"

[[bin]]
name = "ubi2-node"
path = "src/main.rs"

[dependencies]
ubi2-runtime = { path = "../runtime" }
ubi2-rpc = { path = "../rpc" }
ubi2-zkpoh = { path = "../zkpoh" }
# M5 (Stage A): the P2P layer (libp2p, isolated here + in crates/network). The node wires the swarm to
# the chain: routes gossiped txs into the mempool, broadcasts/validates blocks, and runs join-sync. All
# async/libp2p stays in crates/network; the node only consumes its NetworkHandle/NetEvent API.
ubi2-network = { path = "../network" }
# The node maps `Multiaddr`/`PeerId` (re-exported by libp2p via crates/network) for bootstrap dialing
# and the peer table; naming libp2p directly here keeps the wiring readable. Same tree crates/network
# already pulls — no new transitive weight.
libp2p = { workspace = true }
futures.workspace = true
# The node owns the live-oracle wiring: it reads its boot config, builds the provider-backed
# HumanityOracle + ContractInterpreter via `ubi2-oracle::Backend`, and fills `crates/rpc`'s OracleFactory
# seam (so `crates/rpc` itself stays free of the oracle crate). serde/serde_json parse + persist the
# secret-free config file.
ubi2-oracle = { path = "../oracle" }
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
alloy-primitives.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# M5 Stage A integration test (m5_stage_a.rs): signs EIP-155 txs to exercise EC-2/3/4/7.
alloy-consensus.workspace = true
alloy-eips.workspace = true
# k256 is pulled transitively by alloy-primitives (features = ["k256"]) — no new tree weight.
k256 = { version = "0.13", features = ["ecdsa"] }
# Sync gateway integration test (sync_gateway.rs): the WS light client drives the native
# LightCore kernel (the WASM wrapper's pure-Rust inner kernel) and verifies state_root parity.
# tokio-tungstenite: async WS client; futures-util: SinkExt/StreamExt for the split session.
# ubi2-runtime-wasm: the LightCore kernel (no wasm feature — native host).
# ubi2-network: wire types (SyncRequest/SyncResponse/WireBlock) for the binary round-trip.
tokio-tungstenite = "0.24"
futures-util = "0.3"
ubi2-runtime-wasm = { path = "../runtime-wasm", default-features = false }
