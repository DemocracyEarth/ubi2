[package]
name = "ubi2-v2-crypto-bench"
version = "0.1.0"
edition = "2021"
publish = false

# Deliberately separate from the root workspace: these are circuit-design and
# proving dependencies, not dependencies of the production ubi2 verifier.
[workspace]

[dependencies]
ark-bn254 = { version = "=0.5.0", default-features = false, features = ["curve", "std"] }
ark-crypto-primitives = { version = "=0.5.0", default-features = false, features = ["crh", "r1cs", "sponge", "std"] }
ark-ec = { version = "=0.5.0", default-features = false }
ark-ed-on-bn254 = { version = "=0.5.0", default-features = false, features = ["r1cs", "std"] }
ark-ff = { version = "=0.5.0", default-features = false }
ark-groth16 = { version = "=0.5.0", default-features = false, features = ["std"] }
ark-r1cs-std = { version = "=0.5.0", default-features = false, features = ["std"] }
ark-relations = { version = "=0.5.1", default-features = false, features = ["std"] }
ark-serialize = { version = "=0.5.0", default-features = false, features = ["std"] }
ark-snark = { version = "=0.5.1", default-features = false }
ark-std = { version = "=0.5.0", default-features = false, features = ["std"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[profile.release]
codegen-units = 1
lto = "thin"
